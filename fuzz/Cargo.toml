[package]
name = "duit-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
duit-format = { version = "0.1.1", path = "../crates/duit-format" }
duit-model = { version = "0.1.1", path = "../crates/duit-model" }
libfuzzer-sys = { version = "0.4.13" }

[[bin]]
name = "json_import"
path = "fuzz_targets/json_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bin_reader"
path = "fuzz_targets/bin_reader.rs"
test = false
doc = false
bench = false
