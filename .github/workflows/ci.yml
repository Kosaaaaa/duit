name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  # renovate: datasource=crate depName=cargo-deny
  CARGO_DENY_VERSION: 0.20.2
  # renovate: datasource=crate depName=cargo-nextest
  CARGO_NEXTEST_VERSION: 0.9.143
  # renovate: datasource=crate depName=cargo-shear
  CARGO_SHEAR_VERSION: 1.13.4
  # renovate: datasource=crate depName=taplo-cli
  TAPLO_VERSION: 0.10.0
  # renovate: datasource=crate depName=typos-cli
  TYPOS_VERSION: 1.49.0

jobs:
  prek:
    name: "check | prek"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install taplo"
        run: cargo install --locked "taplo-cli@${TAPLO_VERSION}"
      - name: "Install typos"
        run: cargo install --locked "typos-cli@${TYPOS_VERSION}"
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
      - name: "Check that every prettier pin names the same version"
        run: |
          for file in Makefile prek.toml; do
            grep -q 'prettier@[0-9]' "$file" || { echo "::error file=$file::no prettier pin"; exit 1; }
          done
          versions="$(grep -ho 'prettier@[0-9][0-9.]*' Makefile prek.toml | sort -u)"
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::the prettier pins differ: $versions"
            exit 1
          fi

  clippy:
    name: "check | clippy"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          extra-args: --all-files --stage pre-push clippy
          cache: false

  cargo-deny:
    name: "check | cargo deny"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install cargo-deny"
        run: cargo install --locked "cargo-deny@${CARGO_DENY_VERSION}"
      - name: "Check licenses"
        run: cargo deny --all-features check licenses
      - name: "Check sources"
        run: cargo deny --all-features check sources
      - name: "Check bans"
        run: cargo deny --all-features check bans
      - name: "Check the dependencies of the fuzz targets"
        run: cargo deny --manifest-path fuzz/Cargo.toml --all-features check licenses sources bans

  shear:
    name: "check | cargo shear"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install cargo-shear"
        run: cargo install --locked "cargo-shear@${CARGO_SHEAR_VERSION}"
      - run: cargo shear --deny-warnings

  mandoc:
    name: "check | mandoc"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install mandoc"
        run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: mandoc -T lint -W warning crates/duit/duit.1

  zizmor:
    name: "check | zizmor"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  cargo-publish-dry-run:
    name: "check | cargo publish dry-run"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo publish --workspace --locked --dry-run

  test:
    name: "cargo test on ${{ matrix.os }}"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install cargo-nextest"
        run: cargo install --locked "cargo-nextest@${CARGO_NEXTEST_VERSION}"
      - name: "Cargo test"
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --workspace --locked --profile ci --cargo-profile fast-build

  required-checks-passed:
    name: "all required jobs passed"
    if: ${{ always() }}
    needs:
      - prek
      - clippy
      - cargo-deny
      - shear
      - mandoc
      - zizmor
      - cargo-publish-dry-run
      - test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: "Check required jobs passed"
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
