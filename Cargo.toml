[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98.0"
repository = "https://github.com/Kosaaaaa/duit"
authors = ["duit contributors"]
license = "MIT"

[workspace.dependencies]
duit-format = { version = "0.1.2", path = "crates/duit-format" }
duit-model = { version = "0.1.2", path = "crates/duit-model" }
duit-scan = { version = "0.1.2", path = "crates/duit-scan" }
duit-tui = { version = "0.1.2", path = "crates/duit-tui" }

hashbrown = { version = "0.17.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = [
  "bracketed-paste",
  "events",
  "use-dev-tty",
] }
insta = { version = "1.46.0" }
libc = { version = "0.2.191" }
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
rustix = { version = "1.1.6", features = ["fs"] }
tempfile = { version = "3.27.0" }
unicode-width = { version = "0.2.3" }
zstd = { version = "0.13.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
if_not_else = "allow"
use_self = "warn"

# Diagnostics are not actionable: Enable once https://github.com/rust-lang/rust-clippy/issues/13774 is resolved.
large_stack_arrays = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
strip = true
lto = "fat"
panic = "abort"

[profile.dist]
inherits = "release"

[profile.profiling]
inherits = "release"
codegen-units = 1
strip = false
debug = "full"
lto = false

[profile.fast-build]
inherits = "dev"
opt-level = 1
# Disable the local ThinLTO implicitly enabled by `opt-level = 1`.
lto = "off"
debug = 0
strip = "debuginfo"
