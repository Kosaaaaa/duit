[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.0"
repository = "https://github.com/Kosaaaaa/duit"
authors = ["duit contributors"]
license = "MIT"

# Internal crates are listed first and need a `version` next to the `path`, because
# `cargo deny` rejects wildcard requirements:
#
#     duit-model = { version = "0.0.1", path = "crates/duit-model" }
#
# External crates follow. Add an entry together with the first code that uses it:
# `cargo shear` fails on unused dependencies.
[workspace.dependencies]
duit-format = { version = "0.0.1", path = "crates/duit-format" }
duit-model = { version = "0.0.1", path = "crates/duit-model" }

insta = { version = "1.46.0" }
libc = { version = "0.2.191" }
rustix = { version = "1.1.6", features = ["fs"] }
tempfile = { version = "3.27.0" }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Allowed pedantic lints
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
# Disallowed restriction lints
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
if_not_else = "allow"
use_self = "warn"

# Diagnostics are not actionable: Enable once https://github.com/rust-lang/rust-clippy/issues/13774 is resolved.
large_stack_arrays = "allow"

# Skip type and variable debug information to speed up local builds while retaining
# file names and line numbers for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
strip = true
lto = "fat"
# This will still show a panic message, we only skip the unwind.
# The terminal is therefore restored from the panic hook, not from a `Drop` guard.
panic = "abort"

# Mimics the `release` profile, but keeps debug information and skips LTO so that
# benchmark and profiling builds stay fast to compile.
[profile.profiling]
inherits = "release"
codegen-units = 1
strip = false
debug = "full"
lto = false

# Profile for fast test execution: Skip debug info generation, and
# apply basic optimization, which speed up build and running tests.
[profile.fast-build]
inherits = "dev"
opt-level = 1
# Disable the local ThinLTO implicitly enabled by `opt-level = 1`.
lto = "off"
debug = 0
strip = "debuginfo"
