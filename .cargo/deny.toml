[bans]
wildcards = "deny"
multiple-versions = "allow"

[bans.build]
allow-build-scripts = [
  "getrandom",
  "libc",
  "libfuzzer-sys",
  "parking_lot_core",
  "proc-macro2",
  "quote",
  "rustix",
  "rustversion",
  "signal-hook",
  "thiserror",
  "winapi",
  "winapi-i686-pc-windows-gnu",
  "winapi-x86_64-pc-windows-gnu",
  "zstd-safe",
  "zstd-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.95
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]
