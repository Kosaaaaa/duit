[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.6"

# Lint fixes can leave code that needs formatting, so ruff check runs before ruff format.
[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]
types_or = ["python"]
priority = 0

[[repos.hooks]]
id = "ruff-format"
types_or = ["python"]
priority = 1

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.112"

# ty checks the code after both fixers have rewritten it.
[[repos.hooks]]
id = "ty"
types_or = ["python"]
always_run = false
priority = 2
