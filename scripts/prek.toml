default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "9026c9127e153371d7a78dfcb0c45ae2046a3d10"      # frozen: v0.17.6

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]
types_or = ["python"]
priority = 0

[[repos.hooks]]
id = "ruff-format"
types_or = ["python"]
priority = 1

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "d417594e79e318c91a554e907f6dafdbea7e3268"    # frozen: v0.0.112

[[repos.hooks]]
id = "ty"
types_or = ["python"]
always_run = false
priority = 2
