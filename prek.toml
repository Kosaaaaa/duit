# Convenience hooks that run the same checks as `.github/workflows/ci.yml`, which stays the gate.
# The hooks call tools that are already installed: `make tools` installs the versions that CI pins.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

[[repos.hooks]]
id = "taplo"
name = "taplo fmt"
language = "system"
entry = "taplo fmt --check"
pass_filenames = false
types = ["toml"]

[[repos.hooks]]
id = "rustfmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all --check"
pass_filenames = false
types = ["rust"]

# Keep the prettier version in sync with the fmt job in CI.
[[repos.hooks]]
id = "prettier"
name = "prettier"
language = "system"
entry = "npx prettier@3.9.0 --check ."
pass_filenames = false
files = "\\.(md|ya?ml|json5?)$"

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
pass_filenames = false
always_run = true
stages = ["pre-push"]
