# Convenience hooks that run the same checks as `.github/workflows/ci.yml`, which stays the gate.
# Keep the tool versions in sync with CI. The `local` hooks call tools that are already installed,
# and prek installs the tools for the remote hooks itself.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"
hooks = [{ id = "typos" }]

# The hook's PyPI package has no 0.10 release, so it runs taplo 0.9.3 while CI runs 0.10.0.
[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [{ id = "taplo-format" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all --check"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "prettier"
name = "prettier"
language = "system"
entry = "npx prettier@3.9.0 --check ."
pass_filenames = false
files = "\\.(md|ya?ml|json5?)$"

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
pass_filenames = false
always_run = true
stages = ["pre-push"]
