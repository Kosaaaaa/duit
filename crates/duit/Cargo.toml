[package]
name = "duit"
version = { workspace = true }
description = "A disk usage analyzer with a terminal interface, compatible with ncdu"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = ["ncdu", "disk-usage", "du", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["/src", "/LICENSE", "/README.md", "/duit.1"]

[lib]
doctest = false

[lints]
workspace = true

[features]
test-ncdu = []

[dependencies]
duit-format = { workspace = true }
duit-model = { workspace = true }
duit-scan = { workspace = true }
duit-tui = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rustix = { workspace = true, features = ["process", "pty", "stdio", "termios"] }
tempfile = { workspace = true }
zstd = { workspace = true }
