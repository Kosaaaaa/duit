[package]
name = "duit"
version = { workspace = true }
description = "A disk usage analyzer with a terminal interface, compatible with ncdu"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[features]
# Run tests that compare with the real ncdu 2.9.2, which must be on `PATH`.
test-ncdu = []

[dependencies]
duit-format = { workspace = true }
duit-model = { workspace = true }
duit-scan = { workspace = true }
duit-tui = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rustix = { workspace = true, features = ["process", "pty", "stdio", "termios"] }
tempfile = { workspace = true }
zstd = { workspace = true }
